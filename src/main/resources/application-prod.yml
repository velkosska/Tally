# Production: PostgreSQL configured through environment variables, never hard-coded.
spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

tally:
  demo-data:
    enabled: ${DEMO_DATA:false}
  security:
    # Signs remember-me cookies. Required: the app won't start without it. Use a long random value.
    remember-me-key: ${REMEMBER_ME_KEY}
