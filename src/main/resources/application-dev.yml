# Local development: SQL Server from docker-compose.yml, demo data, live template reloads.
# `mvn spring-boot:run` starts the `db` service automatically (spring-boot-docker-compose) and
# connects to it, so no datasource settings are needed here. Docker must be running.
spring:
  docker:
    compose:
      file: docker-compose.yml
  thymeleaf:
    cache: false

tally:
  demo-data:
    enabled: true
  security:
    remember-me-key: dev-only-remember-me-key
