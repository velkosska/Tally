spring:
  application:
    name: tally
  profiles:
    default: dev
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        # Strings are nvarchar in SQL Server, so any language and the € sign are stored correctly.
        use_nationalized_character_data: true
  flyway:
    locations: classpath:db/migration
  servlet:
    multipart:
      # Receipts: ReceiptService allows 5 MB; the request limit leaves room for the form fields.
      max-file-size: 5MB
      max-request-size: 6MB

server:
  port: ${PORT:8080}
  shutdown: graceful
  error:
    whitelabel:
      enabled: false
  compression:
    enabled: true
  tomcat:
    # Read (and throw away) uploads up to this size, so a too-big receipt gets a friendly
    # message instead of a dropped connection.
    max-swallow-size: 20MB

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true
  info:
    java:
      enabled: true

tally:
  demo-data:
    enabled: false
