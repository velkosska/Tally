spring:
  application:
    name: tally
  profiles:
    default: dev
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    locations: classpath:db/migration

server:
  port: ${PORT:8080}
  shutdown: graceful
  error:
    whitelabel:
      enabled: false
  compression:
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true
  info:
    java:
      enabled: true

tally:
  demo-data:
    enabled: false
