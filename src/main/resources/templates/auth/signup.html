<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Create an account')}"></head>
<body>
<header th:replace="~{fragments/layout :: topbar}"></header>

<main class="wrap page page--narrow">
    <h1>Create an account</h1>
    <p class="lead">Start a group for your next trip, your flat or a night out.</p>

    <form class="form panel" method="post" th:action="@{/signup}" th:object="${signupForm}" novalidate>
        <p class="form__notice" th:if="${joiningGroup}" role="status">Create an account and you'll go straight back to your invite.</p>

        <div class="field" th:classappend="${#fields.hasErrors('displayName')} ? 'field--error'">
            <label for="displayName">Your name</label>
            <input id="displayName" type="text" th:field="*{displayName}" maxlength="50" required autofocus
                   autocomplete="name" placeholder="Ana">
            <p class="field__error" th:errors="*{displayName}"></p>
        </div>

        <div class="field" th:classappend="${#fields.hasErrors('email')} ? 'field--error'">
            <label for="email">Email</label>
            <input id="email" type="email" th:field="*{email}" maxlength="254" required autocomplete="email">
            <p class="field__error" th:errors="*{email}"></p>
        </div>

        <div class="field" th:classappend="${#fields.hasErrors('password')} ? 'field--error'">
            <label for="password">Password <span class="optional">at least 8 characters</span></label>
            <input id="password" type="password" th:field="*{password}" required autocomplete="new-password">
            <p class="field__error" th:errors="*{password}"></p>
        </div>

        <div class="field" th:classappend="${#fields.hasErrors('passwordConfirmed')} ? 'field--error'">
            <label for="confirmPassword">Repeat password</label>
            <input id="confirmPassword" type="password" th:field="*{confirmPassword}" required
                   autocomplete="new-password">
            <p class="field__error" th:errors="*{passwordConfirmed}"></p>
        </div>

        <div class="form__actions">
            <button class="btn" type="submit">Create account</button>
        </div>
    </form>

    <p class="auth-switch">Already have an account? <a th:href="@{/login}">Log in</a></p>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
