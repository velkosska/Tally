<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Activity · ' + ${groupName})}"></head>
<body>
<header th:replace="~{fragments/layout :: topbar}"></header>

<main class="wrap page page--narrow">
    <a class="back" th:href="@{/groups/{id}(id=${groupId})}" th:text="${groupName}">Lisbon weekend</a>
    <h1>Activity</h1>
    <p class="lead">Everything people added, changed or deleted in this group, newest first.</p>

    <p class="empty-inline" th:if="${page.isEmpty()}">Nothing has happened here yet.</p>
    <ol th:replace="~{fragments/activity :: list(${page.content}, false)}"></ol>

    <nav class="pager" aria-label="Older and newer activity" th:if="${page.totalPages > 1}">
        <a class="btn btn--ghost btn--small" th:if="${page.hasPrevious()}"
           th:href="@{/groups/{id}/activity(id=${groupId},page=${page.number - 1})}">Newer</a>
        <span class="muted" th:text="'Page ' + ${page.number + 1} + ' of ' + ${page.totalPages}">Page 1 of 3</span>
        <a class="btn btn--ghost btn--small" th:if="${page.hasNext()}"
           th:href="@{/groups/{id}/activity(id=${groupId},page=${page.number + 1})}">Older</a>
    </nav>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
