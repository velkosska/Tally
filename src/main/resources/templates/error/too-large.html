<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('File too large')}"></head>
<body>
<header th:replace="~{fragments/layout :: topbar}"></header>

<main class="wrap page page--narrow error-page">
    <p class="error-page__code">413</p>
    <h1>That file is too large</h1>
    <p class="lead">Receipts can be up to 5 MB. Go back and pick a smaller photo; most phones can share a photo at a
        smaller size.</p>
    <a class="btn" th:href="@{/}">Go to your groups</a>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
