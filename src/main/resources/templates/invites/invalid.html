<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Invite link expired')}"></head>
<body>
<header th:replace="~{fragments/layout :: topbar}"></header>

<main class="wrap page page--narrow error-page">
    <p class="error-page__code">404</p>
    <h1>This invite link doesn’t work any more</h1>
    <p class="lead">Invite links stop working after 14 days, or when someone in the group switches them off.
        Ask whoever sent it for a new one.</p>
    <a class="btn" th:href="@{/}">Go to your groups</a>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
