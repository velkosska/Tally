# PostgreSQL for local development, plus an optional app container that runs Tally like production.
#   mvn spring-boot:run                       starts only `db` (automatically) and runs the app from source
#   docker compose --profile app up --build   runs both in containers, then open http://localhost:8080
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: tally
      POSTGRES_USER: ${DB_USERNAME:-tally}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-tally-dev-password}
    ports:
      - "5432"   # random free host port, so it never clashes with a Postgres already on your machine
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d tally"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    profiles: [app]   # only started with --profile app
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:postgresql://db:5432/tally
      DB_USERNAME: ${DB_USERNAME:-tally}
      DB_PASSWORD: ${DB_PASSWORD:-tally-dev-password}
      DEMO_DATA: ${DEMO_DATA:-true}
      REMEMBER_ME_KEY: ${REMEMBER_ME_KEY:-local-compose-remember-me-key}
    ports:
      - "8080:8080"
    restart: unless-stopped

volumes:
  db-data:
